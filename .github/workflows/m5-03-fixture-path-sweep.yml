name: M5-03 temporary installed-path fixture sweep

on:
  push:
    branches:
      - m5-03-connector-for-nmkr-identity

permissions:
  contents: write

jobs:
  sweep:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align installed plugin path fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          targets = [
              Path('scripts/nmkr-real-sync-preflight-regression.sh'),
              Path('scripts/nmkr-real-sync-phase16a-regression.sh'),
          ]
          for path in targets:
              text = path.read_text(encoding='utf-8')
              updated = text.replace('wp-content/plugins/nmkr-connect', 'wp-content/plugins/connector-for-nmkr')
              updated = updated.replace('git add nmkr-connect/fixture.txt', 'git add connector-for-nmkr/fixture.txt')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  print(f'fixture_path_changed={path}')
          PY
          rm -f .github/workflows/m5-03-fixture-path-sweep.yml
          if grep -nF 'wp-content/plugins/nmkr-connect' scripts/nmkr-real-sync-preflight-regression.sh scripts/nmkr-real-sync-phase16a-regression.sh; then
            echo 'Legacy installed plugin path remains in release-sensitive regression fixtures.' >&2
            exit 1
          fi
      - name: Commit fixture alignment and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'test: align installed plugin path fixtures'
          git push origin HEAD:m5-03-connector-for-nmkr-identity
