name: M5-03 temporary installed-basename sweep

on:
  push:
    branches:
      - m5-03-connector-for-nmkr-identity

permissions:
  contents: write

jobs:
  sweep:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align installed plugin basename defaults
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          targets = [Path('.env.tests.example')]
          targets += sorted(Path('scripts').rglob('*'))
          targets += sorted(Path('tests').rglob('*'))
          changed = []
          for path in targets:
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text.replace('nmkr-connect/nmkr-connect.php', 'connector-for-nmkr/nmkr-connect.php')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'basename_files_changed={len(changed)}')
          for path in changed:
              print(f'basename_changed={path}')
          PY
          rm -f .github/workflows/m5-03-basename-sweep.yml
          if grep -RInF 'nmkr-connect/nmkr-connect.php' .env.tests.example scripts tests --exclude-dir=node_modules; then
            echo 'Legacy installed basename remains in current tooling/tests.' >&2
            exit 1
          fi
      - name: Commit mechanical sweep and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore: align installed plugin basename defaults'
          git push origin HEAD:m5-03-connector-for-nmkr-identity
